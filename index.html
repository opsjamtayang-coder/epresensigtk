    // ==========================================

    // ==========================================
    const DUMMY_SCHOOL = {

    };

    const DUMMY_GPS = {

    };

    const DUMMY_USERS = [
      { id: "u_admin", nuptk: "198001012005011001", nama: "Administrator Utama", email: "admin@nuraeni.sch.id", role: "admin", jk: "L", tempat_lahir: "Bandung", tgl_lahir: "1985-05-10", no_hp: "081234567890", jabatan: "Pengelola Sistem", pass: "admin123" },
      { id: "u_kepsek", nuptk: "197203151998021002", nama: "Drs. H. Mulyana, M.Pd.", email: "kepsek@nuraeni.sch.id", role: "kepsek", jk: "L", tempat_lahir: "Sumedang", tgl_lahir: "1972-03-15", no_hp: "081398765432", jabatan: "Kepala Sekolah", pass: "kepsek123" },
      { id: "u_guru1", nuptk: "199104122019032015", nama: "Siti Aminah, S.Pd.", email: "siti.aminah@nuraeni.sch.id", role: "guru", jk: "P", tempat_lahir: "Garut", tgl_lahir: "1991-04-12", no_hp: "085712344321", jabatan: "Guru Bahasa Indonesia", pass: "guru123" },
      { id: "u_tendik1", nuptk: "199408222020011008", nama: "Ahmad Rizki, A.Md.", email: "ahmad.rizki@nuraeni.sch.id", role: "tendik", jk: "L", tempat_lahir: "Bandung", tgl_lahir: "1994-08-22", no_hp: "089611223344", jabatan: "Staf Tata Usaha", pass: "tendik123" }
    ];

    const DUMMY_ATTENDANCES = [
      { id: "att_1", user_id: "u_guru1", nama: "Siti Aminah, S.Pd.", role: "guru", tanggal: getTodayDateString(), jam_masuk: "06:45:10", jam_pulang: "15:05:22", lat_masuk: -6.917460, lng_masuk: 107.619120, status: "Hadir", jarak_meter: 12 },
      { id: "att_2", user_id: "u_tendik1", nama: "Ahmad Rizki, A.Md.", role: "tendik", tanggal: getTodayDateString(), jam_masuk: "07:15:00", jam_pulang: "", lat_masuk: -6.917450, lng_masuk: 107.619130, status: "Terlambat", jarak_meter: 25 }
    ];

    const DUMMY_SUBMISSIONS = [
      { id: "sub_1", user_id: "u_guru1", nama: "Siti Aminah, S.Pd.", jenis: "Izin", tgl_mulai: getTodayDateString(), tgl_selesai: getTodayDateString(), keterangan: "Mengikuti seminar kurikulum merdeka", bukti_url: "", status: "Pending", approved_by: "" }
    ];

    const DUMMY_HOLIDAYS = [
      { id: "hol_1", tanggal: "2026-08-17", keterangan: "HUT Kemerdekaan RI" },
      { id: "hol_2", tanggal: "2026-12-25", keterangan: "Hari Raya Natal" }
    ];

    // ==========================================
    // APP STATE MANAGEMENT
    // ==========================================
    let currentUser = null;
    let currentView = 'dashboard';

    // Application Memory Store
    let state = {
      school: { ...DUMMY_SCHOOL },
      gps: { ...DUMMY_GPS },
      users: [...DUMMY_USERS],
      attendances: [...DUMMY_ATTENDANCES],
      submissions: [...DUMMY_SUBMISSIONS],
      holidays: [...DUMMY_HOLIDAYS]
    };

    // Helper: Date string YYYY-MM-DD
    function getTodayDateString() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    // Initialize App & PWA
    window.addEventListener('DOMContentLoaded', () => {
      initPWA();
      setupPreviewBanner();
      
      // Auto login in preview mode for smooth testing, or check auth state
      if (IS_PREVIEW) {
        currentUser = state.users[0]; // Default to Admin
        renderAppLayout();
        navigate('dashboard');
      } else {
        checkFirebaseAuth();
      }
    });

    function setupPreviewBanner() {
      const banner = document.getElementById('preview-banner');
      if (IS_PREVIEW && banner) {
        banner.classList.remove('hidden');
      }
    }

    function initPWA() {
      // Dynamic Manifest URI
      const manifest = {
        name: "E-Presensi SMP NURAENI",
        short_name: "PresensiNuraeni",
        start_url: "./",
        display: "standalone",
        background_color: "#ffffff",
        theme_color: "#16a34a",
        icons: [
          { src: "https://placehold.co/192x192/16a34a/ffffff?text=SMP+NURAENI", sizes: "192x192", type: "image/png" },
          { src: "https://placehold.co/512x512/16a34a/ffffff?text=SMP+NURAENI", sizes: "512x512", type: "image/png" }
        ]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      const manifestURL = URL.createObjectURL(blob);
      document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

      // Register Inline Service Worker via Blob
      if ('serviceWorker' in navigator) {
        const swCode = `
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
        `;
        const swBlob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(err => console.log('SW registration skipped:', err));
      }
    }

    // ==========================================
    // AUTHENTICATION & ROLE MANAGEMENT
    // ==========================================
    function checkFirebaseAuth() {
      if (!auth) return renderLoginPage();
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          // Fetch user details from Firestore
          try {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
              currentUser = { id: user.uid, ...userDoc.data() };
              renderAppLayout();
              navigate('dashboard');
            } else {
              renderLoginPage("Akun Anda belum terdaftar di database Firestore sekolah.");
            }
          } catch (e) {
            renderLoginPage("Gagal memuat profil pengguna.");
          }
        } else {
          renderLoginPage();
        }
      });
    }

    window.handleLoginSubmit = async function(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-id').value.trim();
      const pass = document.getElementById('login-pass').value;
      const errorEl = document.getElementById('login-error');
      errorEl.classList.add('hidden');

      if (IS_PREVIEW) {
        // Mode Preview: Cocokkan email/nuptk & pass
        const found = state.users.find(u => (u.email === identifier || u.nuptk === identifier) && u.pass === pass);
        if (found) {
          currentUser = found;
          renderAppLayout();
          navigate('dashboard');
        } else {
          errorEl.textContent = "Credential tidak valid. Silakan periksa daftar akun demo.";
          errorEl.classList.remove('hidden');
        }
      } else {
        // Mode Produksi: Firebase Authentication
        try {
          await signInWithEmailAndPassword(auth, identifier, pass);
        } catch (err) {
          errorEl.textContent = "Gagal Login: " + err.message;
          errorEl.classList.remove('hidden');
        }
      }
    };

    window.handleLogout = function() {
      if (!IS_PREVIEW && auth) {
        signOut(auth);
      }
      currentUser = null;
      renderLoginPage();
    };

    function renderLoginPage(msg = "") {
      const container = document.getElementById('main-content');
      document.getElementById('sidebar').classList.add('hidden');
      document.getElementById('mobile-nav-bar').classList.add('hidden');

      container.innerHTML = `
        <div class="min-h-[80vh] flex items-center justify-center py-10 px-4">
          <div class="glass-panel max-w-md w-full p-8 rounded-3xl shadow-xl space-y-6">
            <div class="text-center space-y-2">
              <div class="w-20 h-20 bg-brand-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-extrabold shadow-lg shadow-brand-500/30">
                SN
              </div>
              <h2 class="text-2xl font-bold tracking-tight text-slate-800 dark:text-slate-100">${state.school.nama_sekolah}</h2>
              <p class="text-xs text-slate-500">Sistem E-Presensi Guru & Staff Terpadu</p>
            </div>

            ${msg ? `<div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs">${msg}</div>` : ''}
            <div id="login-error" class="hidden p-3 bg-red-50 text-red-600 rounded-xl text-xs"></div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Email / NUPTK</label>
                <input type="text" id="login-id" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:ring-2 focus:ring-brand-500 outline-none transition" placeholder="Masukkan Email atau NUPTK">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Password</label>
                <input type="password" id="login-pass" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:ring-2 focus:ring-brand-500 outline-none transition" placeholder="••••••••">
              </div>
              <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold shadow-lg shadow-brand-600/30 text-sm transition">
                Masuk Sistem Presensi
              </button>
            </form>

            ${IS_PREVIEW ? `
              <div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 text-xs">
                <p class="font-bold text-slate-700 dark:text-slate-300 mb-2">Akun Uji Coba Demo (Mode Preview):</p>
                <div class="space-y-1 text-[11px] text-slate-600 dark:text-slate-400">
                  <p><strong>Admin:</strong> admin@nuraeni.sch.id | Pass: admin123</p>
                  <p><strong>Kepala Sekolah:</strong> kepsek@nuraeni.sch.id | Pass: kepsek123</p>
                  <p><strong>Guru:</strong> siti.aminah@nuraeni.sch.id | Pass: guru123</p>
                  <p><strong>Tendik:</strong> ahmad.rizki@nuraeni.sch.id | Pass: tendik123</p>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    // ==========================================
    // LAYOUT & ROUTING SYSTEM
    // ==========================================
    function renderAppLayout() {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('mobile-nav-bar').classList.remove('hidden');
      
      // Update sidebar headers
      document.getElementById('sidebar-school-name').textContent = state.school.nama_sekolah;
      document.getElementById('sidebar-user-role').textContent = currentUser.role === 'kepsek' ? 'Kepala Sekolah' : currentUser.role;
      document.getElementById('mobile-user-role').textContent = currentUser.role;
      document.getElementById('sidebar-user-name').textContent = currentUser.nama;
      document.getElementById('sidebar-user-avatar').textContent = currentUser.nama.charAt(0);

      // Render Dynamic Side Menu & Bottom Navigation based on Role
      renderNavigationMenu();
    }

    function renderNavigationMenu() {
      const desktopNav = document.getElementById('desktop-nav-menu');
      const mobileNav = document.getElementById('mobile-nav-bar');
      
      let menus = [];

      if (currentUser.role === 'admin') {
        menus = [
          { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
          { id: 'data-sekolah', label: 'Data Sekolah', icon: 'school' },
          { id: 'data-guru', label: 'Data Guru', icon: 'users' },
          { id: 'data-tendik', label: 'Data Tendik', icon: 'user-cog' },
          { id: 'approval', label: 'Approval Persetujuan', icon: 'check-square' },
          { id: 'manajemen-user', label: 'Manajemen User', icon: 'shield-check' },
          { id: 'kalender-libur', label: 'Kalender Libur', icon: 'calendar' },
          { id: 'rekapan-cetak', label: 'Rekapan & Cetak', icon: 'file-text' },
          { id: 'konfigurasi-gps', label: 'Konfigurasi Sistem', icon: 'settings' }
        ];
      } else if (currentUser.role === 'kepsek') {
        menus = [
          { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
          { id: 'data-guru', label: 'Data Guru', icon: 'users' },
          { id: 'data-tendik', label: 'Data Tendik', icon: 'user-cog' },
          { id: 'approval', label: 'Approval Persetujuan', icon: 'check-square' },
          { id: 'rekapan-presensi', label: 'Rekapan Presensi', icon: 'file-text' }
        ];
      } else {
        // Guru & Tendik
        menus = [
          { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
          { id: 'isi-presensi', label: 'Isi Presensi', icon: 'fingerprint' },
          { id: 'pengajuan', label: 'Pengajuan Izin', icon: 'send' },
          { id: 'profil-pribadi', label: 'Data Pribadi', icon: 'user' },
          { id: 'riwayat-presensi', label: 'Riwayat Presensi', icon: 'history' },
          { id: 'rekapan-presensi', label: 'Rekapan Saya', icon: 'file-text' }
        ];
      }

      // Render Desktop Side Bar
      desktopNav.innerHTML = menus.map(m => `
        <button onclick="navigate('${m.id}')" id="nav-btn-${m.id}" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-medium transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="${m.icon}" class="w-4 h-4"></i>
          <span>${m.label}</span>
        </button>
      `).join('');

      // Render Mobile Bottom Navigation (Show max 5 primary items)
      const mobileItems = menus.slice(0, 5);
      mobileNav.innerHTML = mobileItems.map(m => `
        <button onclick="navigate('${m.id}')" id="mobile-nav-btn-${m.id}" class="flex flex-col items-center gap-1 p-2 text-[10px] font-medium text-slate-500">
          <i data-lucide="${m.icon}" class="w-5 h-5"></i>
          <span>${m.label.split(' ')[0]}</span>
        </button>
      `).join('');

      lucide.createIcons();
    }

    window.navigate = function(viewId) {
      currentView = viewId;

      // Update Nav active styles
      document.querySelectorAll('#desktop-nav-menu button').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white', 'hover:bg-brand-700');
        btn.classList.add('text-slate-600', 'dark:text-slate-400');
      });
      const activeDesktopBtn = document.getElementById(`nav-btn-${viewId}`);
      if (activeDesktopBtn) {
        activeDesktopBtn.classList.add('bg-brand-600', 'text-white');
        activeDesktopBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
      }

      // Render Views
      const container = document.getElementById('main-content');
      switch(viewId) {
        case 'dashboard': renderDashboard(container); break;
        case 'data-sekolah': renderDataSekolah(container); break;
        case 'data-guru': renderDataGTK(container, 'guru'); break;
        case 'data-tendik': renderDataGTK(container, 'tendik'); break;
        case 'approval': renderApproval(container); break;
        case 'manajemen-user': renderManajemenUser(container); break;

    window.saveGTK = function(e, role, id) {
      e.preventDefault();
      const payload = {
        nama: document.getElementById('gtk-nama').value,
        nuptk: document.getElementById('gtk-nuptk').value,
        jk: document.getElementById('gtk-jk').value,
        email: document.getElementById('gtk-email').value,

        tgl_lahir: document.getElementById('gtk-tgl').value,
        jabatan: document.getElementById('gtk-jabatan').value,
        no_hp: document.getElementById('gtk-hp').value,
        role: role,
        pass: "123456" // Default password
      };

      if (id) {
        const idx = state.users.findIndex(u => u.id === id);
        if (idx !== -1) state.users[idx] = { ...state.users[idx], ...payload };
      } else {
        payload.id = 'u_' + Date.now();
        state.users.push(payload);
      }
      closeModal();
      showNotification("Data berhasil disimpan.");
      navigate(role === 'guru' ? 'data-guru' : 'data-tendik');

                Check-In (Masuk)<br>

              <button id="btn-checkout" onclick="processPresensi('pulang')" ${(!myAtt?.jam_masuk || myAtt?.jam_pulang) ? 'disabled' : ''} class="py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-600/30 transition">
                Check-Out (Pulang)<br>
                <span class="text-[10px] font-normal">${myAtt?.jam_pulang ? 'Sudah Pulang: '+myAtt.jam_pulang : 'Klik untuk Pulang'}</span>
              </button>

          </div>
        </div>
      `;

      startLiveClock();
      checkUserLocation();
    }

    let currentLat = null, currentLng = null, currentDistance = 9999;

    function startLiveClock() {
      const clockEl = document.getElementById('live-clock');
      setInterval(() => {
        if (clockEl) {
          const d = new Date();
          clockEl.textContent = d.toTimeString().split(' ')[0];
        }
      }, 1000);
    }

    function checkUserLocation() {
      const statusText = document.getElementById('gps-status-text');
      const coordText = document.getElementById('gps-coord-text');

      if (!navigator.geolocation) {
        if (statusText) statusText.textContent = "Geolokasi tidak didukung oleh browser Anda.";
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        currentDistance = Math.round(haversineDistance(currentLat, currentLng, state.gps.lat, state.gps.lng));

        if (coordText) coordText.textContent = `Lat: ${currentLat.toFixed(5)} | Lng: ${currentLng.toFixed(5)}`;
        
        if (currentDistance <= state.gps.radius_meter) {
          if (statusText) {
            statusText.className = "font-bold text-emerald-600";
            statusText.textContent = `Anda di dalam lokasi sekolah (${currentDistance}m dari pusat GPS)`;
          }
        } else {
          if (statusText) {
            statusText.className = "font-bold text-amber-600";
            statusText.textContent = `Anda di luar area radius (${currentDistance}m / Maks: ${state.gps.radius_meter}m)`;
          }
        }
      }, (err) => {
        // Fallback for demo preview mode if GPS permission is denied or simulated
        currentLat = state.gps.lat;
        currentLng = state.gps.lng;
        currentDistance = 15;
        if (statusText) {
          statusText.className = "font-bold text-emerald-600";
          statusText.textContent = `GPS Uji Coba: Berada dalam radius (${currentDistance}m)`;
        }
      });
    }

    // Haversine Distance Formula in Meters
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Earth radius in meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    window.processPresensi = function(type) {
      if (currentDistance > state.gps.radius_meter) {
        showNotification(`Gagal: Jarak Anda (${currentDistance}m) melebihi batas radius (${state.gps.radius_meter}m).`, 'error');
        return;
      }

      const today = getTodayDateString();
      const timeNow = new Date().toTimeString().split(' ')[0];
      let myAtt = state.attendances.find(a => a.user_id === currentUser.id && a.tanggal === today);

      if (type === 'masuk') {
        if (!myAtt) {
          const isTerlambat = parseInt(timeNow.replace(/:/g, '')) > 71500; // > 07:15:00
          state.attendances.push({
            id: 'att_' + Date.now(),
            user_id: currentUser.id,
            nama: currentUser.nama,
            role: currentUser.role,
            tanggal: today,
            jam_masuk: timeNow,
            jam_pulang: '',
            lat_masuk: currentLat,
            lng_masuk: currentLng,
            status: isTerlambat ? 'Terlambat' : 'Hadir',
            jarak_meter: currentDistance
          });
          showNotification(`Check-In Berhasil pada pukul ${timeNow}!`);
        }
      } else if (type === 'pulang') {
        if (myAtt) {
          myAtt.jam_pulang = timeNow;
          myAtt.lat_pulang = currentLat;
          myAtt.lng_pulang = currentLng;
          showNotification(`Check-Out Pulang Berhasil pada pukul ${timeNow}!`);
        }
      }
      navigate('isi-presensi');
    };

            <div><span class="text-slate-400">No. Telepon:</span> <p class="font-semibold">${currentUser.no_hp}</p></div>
          </div>
        </div>
      `;
    }

    function renderRiwayatPresensi(container) {
      const myLogs = state.attendances.filter(a => a.user_id === currentUser.id);
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-xl font-bold tracking-tight">Riwayat Presensi Pribadi</h2>
          <div class="glass-panel rounded-2xl border overflow-hidden text-xs">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 dark:bg-slate-800 border-b">
                  <th class="py-3 px-4">Tanggal</th>
                  <th class="py-3 px-4">Jam Masuk</th>
                  <th class="py-3 px-4">Jam Pulang</th>
                  <th class="py-3 px-4">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${myLogs.map(a => `
                  <tr>
                    <td class="py-3 px-4 font-semibold">${a.tanggal}</td>
                    <td class="py-3 px-4 text-emerald-600">${a.jam_masuk || '-'}</td>
                    <td class="py-3 px-4 text-blue-600">${a.jam_pulang || '-'}</td>
                    <td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold text-[10px]">${a.status}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Helper UI Elements
    function renderAccessDenied(container) {
      container.innerHTML = `<div class="p-8 text-center text-red-500 font-bold">Akses Ditolak: Anda tidak memiliki wewenang membuka halaman ini.</div>`;
    }

    window.openModal = function() {
      document.getElementById('modal-backdrop').classList.remove('hidden');
    };
    window.closeModal = function() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    };

    function showNotification(msg, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-20 right-4 z-50 px-4 py-3 rounded-xl text-white text-xs font-semibold shadow-xl transition transform ${type==='error'?'bg-red-600':'bg-emerald-600'}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
